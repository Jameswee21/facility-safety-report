<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e7490">
<title>안전 · 시설 신고 접수</title>
<link rel="stylesheet" href="start.css?v=1">
</head>
<body>

<main class="start">

  <header class="start-head">
    <p class="eyebrow">원내 통합 신고 접수</p>
    <h1>어떤 상황인가요?</h1>
    <p class="sub">해당하는 버튼을 눌러 주세요</p>
  </header>

  <!-- ==========================================================
       연결 주소 안내
       · 다칠 것 같아요 / 다칠 뻔했어요 → safety.html (안전보건팀, 별도 접수)
       · 고장났어요 / 불편해요      → index.html  (시설팀, 기존 신고화면)
       ========================================================== -->

  <a class="pick safety" href="safety.html">
    <span class="pick-ico">⚠️</span>
    <span class="pick-body">
      <span class="pick-title">다칠 것 같아요<br>다칠 뻔했어요</span>
      <span class="pick-desc">위험한 곳 · 아차사고</span>
      <span class="pick-team">안전보건팀에서 접수합니다</span>
    </span>
    <span class="pick-go">›</span>
  </a>

  <a class="pick facility" href="index.html?type=facility">
    <span class="pick-ico">🔧</span>
    <span class="pick-body">
      <span class="pick-title">고장났어요<br>불편해요</span>
      <span class="pick-desc">시설 파손 · 고장 · 위생</span>
      <span class="pick-team">시설팀에서 접수합니다</span>
    </span>
    <span class="pick-go">›</span>
  </a>

  <p class="guide">
    어느 쪽인지 잘 모르겠으면 아무거나 눌러주세요.<br>
    <b>분류는 저희가 합니다.</b>
  </p>

  <section class="notice">
    <p class="notice-item">
      <span class="ni-ico">🗓</span>
      <span>토 · 일 및 공휴일은 접수가 지연될 수 있습니다.</span>
    </p>
    <p class="notice-item urgent">
      <span class="ni-ico">☎</span>
      <span>
        시설보수 관련해서는 <b>긴급 시</b> 아래로 직접 연락 바랍니다.
        <span class="tels">
          <span class="tel"><em>전기실</em>6263</span>
          <span class="tel"><em>기계실</em>6262</span>
        </span>
      </span>
    </p>
  </section>

</main>

</body>
</html>
